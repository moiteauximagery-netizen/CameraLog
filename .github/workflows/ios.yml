name: iOS - Tests et IPA pour iPhone

on:
  push:
    branches: [main, 'work/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Standard public-repository runner only: no paid runner or private build.
    if: github.event.repository.private == false
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # The previously shipped commit is needed to write a real version 1 store.
          fetch-depth: 0

      - name: Environnement Apple et structure du projet
        run: |
          xcodebuild -version
          python3 scripts/check_project.py
          plutil -lint CameraLog.xcodeproj/project.pbxproj

      - name: Choisir un simulateur iPhone disponible
        run: python3 scripts/select_simulator.py

      - name: Base écrite par la version installée (commit 241fd6e, IPA du run 7)
        run: |
          set -o pipefail
          mkdir -p build
          legacy="$RUNNER_TEMP/legacy"
          git worktree add --detach "$legacy" 241fd6e7839f6961eb17c7186d6c586c4b846283
          cp ci/legacy/LegacyFixtureWriter.swift "$legacy/CameraLogTests/"
          (cd "$legacy" && python3 scripts/generate_project.py)
          TEST_RUNNER_CAMERALOG_V1_FIXTURE="$RUNNER_TEMP/v1" xcodebuild test \
            -project "$legacy/CameraLog.xcodeproj" -scheme CameraLog \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -destination-timeout 180 \
            -only-testing:CameraLogTests/LegacyFixtureWriter \
            -derivedDataPath "$RUNNER_TEMP/legacy-dd" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/legacy-fixture.log
          test -f "$RUNNER_TEMP/v1/legacy.store"
          test -f "$RUNNER_TEMP/v1/ids.json"
          ls -la "$RUNNER_TEMP/v1"
          echo "CAMERALOG_V1_FIXTURE=$RUNNER_TEMP/v1" >> "$GITHUB_ENV"

      - name: Base écrite par la build 15 (commit 20df5d9, fiches)
        run: |
          set -o pipefail
          build15="$RUNNER_TEMP/build15"
          git worktree add --detach "$build15" 20df5d9faa3c8c269f4699e7d6e0caad60ec1a90
          cp ci/legacy/Build15FixtureWriter.swift "$build15/CameraLogTests/"
          (cd "$build15" && python3 scripts/generate_project.py)
          TEST_RUNNER_CAMERALOG_V2_FIXTURE="$RUNNER_TEMP/v2" xcodebuild test \
            -project "$build15/CameraLog.xcodeproj" -scheme CameraLog \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -destination-timeout 180 \
            -only-testing:CameraLogTests/Build15FixtureWriter \
            -derivedDataPath "$RUNNER_TEMP/build15-dd" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/build15-fixture.log
          test -f "$RUNNER_TEMP/v2/build15.store"
          test -f "$RUNNER_TEMP/v2/ids.json"
          ls -la "$RUNNER_TEMP/v2"
          echo "CAMERALOG_V2_FIXTURE=$RUNNER_TEMP/v2" >> "$GITHUB_ENV"

      - name: Base écrite par la build 18 (commit 90ec24a, kits du projet)
        run: |
          set -o pipefail
          build18="$RUNNER_TEMP/build18"
          git worktree add --detach "$build18" 90ec24a225caf260e2fe717c9ad5df8397dcec5d
          cp ci/legacy/Build18FixtureWriter.swift "$build18/CameraLogTests/"
          (cd "$build18" && python3 scripts/generate_project.py)
          TEST_RUNNER_CAMERALOG_V3_FIXTURE="$RUNNER_TEMP/v3" xcodebuild test \
            -project "$build18/CameraLog.xcodeproj" -scheme CameraLog \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -destination-timeout 180 \
            -only-testing:CameraLogTests/Build18FixtureWriter \
            -derivedDataPath "$RUNNER_TEMP/build18-dd" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/build18-fixture.log
          test -f "$RUNNER_TEMP/v3/build18.store"
          test -f "$RUNNER_TEMP/v3/ids.json"
          echo "CAMERALOG_V3_FIXTURE=$RUNNER_TEMP/v3" >> "$GITHUB_ENV"

      - name: Tests XCTest sur simulateur
        run: |
          set -o pipefail
          mkdir -p build
          TEST_RUNNER_CAMERALOG_V1_FIXTURE="$CAMERALOG_V1_FIXTURE" \
          TEST_RUNNER_CAMERALOG_V2_FIXTURE="$CAMERALOG_V2_FIXTURE" \
          TEST_RUNNER_CAMERALOG_V3_FIXTURE="$CAMERALOG_V3_FIXTURE" xcodebuild test \
            -project CameraLog.xcodeproj -scheme CameraLog \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -destination-timeout 180 \
            -parallel-testing-enabled NO \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/CameraLogTests.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/tests.log

      - name: Compiler pour un vrai iPhone (ARM64)
        run: |
          set -o pipefail
          xcodebuild build \
            -project CameraLog.xcodeproj -scheme CameraLog \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            2>&1 | tee build/device-build.log

      - name: Préparer CameraLog.ipa pour signature locale
        run: |
          set -euo pipefail
          app='build/DerivedData/Build/Products/Release-iphoneos/CameraLog.app'
          test -f "$app/CameraLog"
          lipo "$app/CameraLog" -verify_arch arm64
          mkdir -p build/package/Payload
          ditto "$app" build/package/Payload/CameraLog.app
          cd build/package
          ditto -c -k --keepParent Payload ../CameraLog.ipa
          cd ../..
          python3 scripts/check_ipa.py build/CameraLog.ipa

      - name: Fichier à télécharger pour Sideloadly
        uses: actions/upload-artifact@v4
        with:
          name: CameraLog-iPhone-unsigned
          path: build/CameraLog.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Erreurs lisibles dans le résumé du run
        if: failure()
        run: python3 scripts/report_errors.py build/legacy-fixture.log build/build15-fixture.log build/build18-fixture.log build/tests.log build/device-build.log

      - name: Captures d'écran des tests d'interface
        if: always()
        run: |
          if [ -d build/CameraLogTests.xcresult ]; then
            xcrun xcresulttool export attachments --path build/CameraLogTests.xcresult --output-path build/screenshots || true
            echo "::notice title=Captures exportées::$(find build/screenshots -type f 2>/dev/null | wc -l | tr -d ' ') fichier(s)"
          fi

      - name: Résumé lisible des tests
        if: always()
        run: |
          if [ -d build/CameraLogTests.xcresult ]; then
            xcrun xcresulttool get test-results summary \
              --path build/CameraLogTests.xcresult > build/test-summary.json
            cat build/test-summary.json
            python3 scripts/report_tests.py build/CameraLogTests.xcresult || true
          fi

      - name: Journaux et résultats des tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CameraLog-diagnostics
          path: |
            build/*.log
            build/test-summary.json
            build/screenshots
            build/CameraLogTests.xcresult
          if-no-files-found: ignore
          retention-days: 3
